name: Runner Canary

# Temporary probe for evaluating Canonical self-hosted runner pools (as used
# by e.g. canonical/chisel-releases) as hosts for the arm64 spread tests. The
# main questions: does the pool pick up jobs from this repo at all, is
# /dev/kvm available (native-speed VMs instead of TCG emulation), and how
# much CPU/RAM/disk a flavor provides. Delete once the answers are in.
#
# Note: if the repo is not enrolled for a pool, the job just sits queued --
# timeout-minutes only starts counting once a runner picks the job up.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label to probe"
        required: false
        type: string
        default: self-hosted-linux-arm64-noble-medium

jobs:
  probe:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    steps:
      - name: Probe virtualization and resources
        run: |
          echo "=== system"
          uname -a
          echo "=== cpu"
          nproc
          lscpu || true
          echo "=== memory"
          free -h
          echo "=== disk"
          df -h / /tmp || true
          echo "=== kvm"
          ls -l /dev/kvm || echo "no /dev/kvm"
          echo "=== snapd"
          snap version || echo "no snapd"
          echo "=== sudo"
          sudo -n true && echo "passwordless sudo OK" || echo "no passwordless sudo"
