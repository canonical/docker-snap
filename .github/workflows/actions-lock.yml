name: Actions Lockfile

# Not path-filtered, so the job can be a required check: a pin that no longer
# verifies upstream fails here whatever the pull request touches.
on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      # After changing any `uses:` line, run `gh actions-lock` and commit the
      # updated .github/workflows/actions.lock with it.
      - name: Verify the lockfile
        run: gh actions-lock --verify
