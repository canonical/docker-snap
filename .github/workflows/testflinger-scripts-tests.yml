name: Testflinger Scripts Tests

on:
  pull_request:
    paths:
      - ".github/workflows/testflinger/scripts/**"
      - ".github/workflows/testflinger-scripts-tests.yml"

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats .github/workflows/testflinger/scripts/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # shellcheck is preinstalled on the runner image. These scripts orchestrate
      # ssh and rely on intentional word-splitting (ssh option lists) and
      # client-side variable expansion, which trip info-level SC2086/SC2029.
      # Gate on warning+ so genuine bugs fail CI without annotating every
      # deliberate split. The .bats files are bats syntax, not shellcheck-able.
      - name: Run shellcheck
        run: shellcheck --severity=warning .github/workflows/testflinger/scripts/*.sh
