name: Scripts Tests

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "spread/scripts/**"

# Cancel an in-progress run when a newer commit lands on the same ref, so a
# burst of pushes to a branch or PR only tests the latest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: |
          bats .github/workflows/testflinger/scripts/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # shellcheck is preinstalled on the runner image. The .bats files are
      # not shellcheck-able (bats syntax), so only the plain scripts run.
      - name: Run shellcheck
        run: |
          shellcheck .github/workflows/testflinger/scripts/*.sh
