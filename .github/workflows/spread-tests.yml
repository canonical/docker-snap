name: Spread Tests

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel containing the version of docker to test"
        required: true
        type: string
      spread_test_filter:
        description: "Spread test selection filter; use '...' as a wildcard"
        required: false
        type: string
        default: '...amd64'
      force_rebuild:
        description: "Ignore cached images and provision from scratch"
        required: false
        type: boolean
        default: false
      publish_boot_logs:
        description: "Publish boot logs even for passing systems (e.g. to collect evidence of slow-but-healthy boots)"
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

env:
  # Pristine downloads plus the provisioned overlay / firmware / seed for one
  # system, cached as a single per-system entry. The overlay references the
  # pristine image by absolute path with no content check, so both must travel
  # together. Logs and pid files are excluded.
  cache_paths: |
    ~/snap/image-garden/common/cache/dl
    .image-garden/*.qcow2
    .image-garden/*.img
    .image-garden/*.iso
    .image-garden/*.run

jobs:
  # Expand the filter into the concrete systems it selects, so the test job can
  # fan them out -- one system per job, one emulated guest per runner. That
  # removes the boot contention that made running every system on one runner
  # flaky, and runs them in parallel.
  list-systems:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      image_garden_rev: ${{ steps.prep.outputs.image_garden_rev }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prep
        id: prep
        run: |
          sudo snap install image-garden
          # Provisioned images are a function of the image-garden version, so
          # its snap revision keys the caches.
          echo "image_garden_rev=$(snap list image-garden | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - name: List systems
        id: list
        run: |
          # spread -list prints backend:system:suite/task per line.
          systems=$(image-garden.spread -list "${{ inputs.spread_test_filter }}" | awk -F: '/spread\//{print $2}' | sort -u)
          echo "systems:"; echo "$systems"
          matrix=$(printf '%s\n' $systems | jq -R . | jq -sc '{system: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  spread-tests:
    needs: list-systems
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-systems.outputs.matrix) }}
    runs-on: ubuntu-latest
    # One emulated system per runner; a cold system provisions then tests, a
    # warm one just tests. Bound the run step below the job timeout so a slow
    # cold run fails (and saves its image) rather than being cancelled. Sized
    # for the slowest cold lane observed: dracut-based images (26.04+) on the
    # slowest emulated targets take just under an hour cold.
    timeout-minutes: 80
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prep
        run: |
          sudo snap install image-garden

          # The base snap carries the x86_64 emulator; other arches live in
          # optional components. Install only the one this system needs --
          # without it, allocation fails on missing EDK2 firmware.
          case "${{ matrix.system }}" in
            *.arm64) sudo snap install image-garden+qemu-aarch64 ;;
            *.riscv64) sudo snap install image-garden+qemu-riscv64 ;;
            *.s390x) sudo snap install image-garden+qemu-s390x ;;
            *.ppc64el) sudo snap install image-garden+qemu-ppc64 ;;
          esac

          sudo chmod -v 666 /dev/kvm || true

      - name: Restore cached virtual machine image
        id: restore-image
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.cache_paths }}
          key: image-garden-${{ matrix.system }}-r${{ needs.list-systems.outputs.image_garden_rev }}
          restore-keys: |
            image-garden-${{ matrix.system }}-

      - name: Run spread tests
        timeout-minutes: 70
        run: |
          SNAP_CHANNEL="${{ inputs.snap_channel }}" image-garden.spread -v -vv "${{ matrix.system }}"

      - name: Log image garden content
        if: ${{ failure() || inputs.publish_boot_logs }}
        run: |
          echo "Image Garden directory content:"
          ls -lah .image-garden/

          echo "Image Garden cache content:"
          ls -lah ~/snap/image-garden/common/cache/dl/

      - name: Upload logs as artifacts
        if: ${{ failure() || inputs.publish_boot_logs }}
        uses: actions/upload-artifact@v7
        with:
          # Unique per matrix job, or parallel uploads collide.
          name: boot-logs-${{ matrix.system }}
          path: .image-garden/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true

      - name: Save cached virtual machine image
        # Save even on a failing run (a provisioned image is still reusable), but
        # not on cancellation, which can leave a half-written overlay. Skipped
        # when the exact key was already a hit.
        if: ${{ (success() || failure()) && steps.restore-image.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.cache_paths }}
          key: image-garden-${{ matrix.system }}-r${{ needs.list-systems.outputs.image_garden_rev }}
