name: Spread Tests

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel containing the version of docker to test"
        required: true
        type: string
      spread_test_filter:
        description: "Spread test selection filter; use '...' as a wildcard"
        required: false
        type: string
        default: '...amd64'
      force_rebuild:
        description: "Ignore cached images and provision from scratch"
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  spread-tests:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - label: ubuntu-latest
            spread_test_filter: ${{ inputs.spread_test_filter }}

    runs-on: ${{ matrix.runner.label }}
    # Backstop against a pathological hang burning the full 6h GitHub ceiling.
    # A healthy run finishes far sooner; the allocate script fails fast on
    # unreachable VMs.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prep
        id: prep
        run: |
          sudo snap install image-garden
          sudo snap install image-garden+qemu-aarch64 || true

          # We need write access to /dev/kvm for better performance.
          # Since this is an ephemeral CI/CD environment, we can grant everyone access to /dev/kvm.
          sudo chmod -v 666 /dev/kvm || true

          # Provisioned images are a function of the image-garden version, so
          # its snap revision keys the cache below.
          echo "image_garden_rev=$(snap list image-garden | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore cached virtual machine images
        id: restore-images
        if: ${{ !inputs.force_rebuild }}
        # Pristine downloads and the provisioned overlays derived from them are
        # cached as one entry: the overlays are qcow2 files backed by the
        # pristine images by absolute path with no content check, so restoring
        # them from different saves could silently corrupt guests. Logs and pid
        # files are excluded.
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/snap/image-garden/common/cache/dl
            .image-garden/*.qcow2
            .image-garden/*.img
            .image-garden/*.iso
            .image-garden/*.run
          key: image-garden-${{ matrix.runner.spread_test_filter }}-r${{ steps.prep.outputs.image_garden_rev }}
          restore-keys: |
            image-garden-${{ matrix.runner.spread_test_filter }}-

      - name: Run spread tests
        run: |
          SNAP_CHANNEL="${{ inputs.snap_channel }}" image-garden.spread -v -vv "${{ matrix.runner.spread_test_filter }}"

      - name: Log image garden content
        if: ${{ failure() }}
        run: |
          echo "Image Garden directory content:"
          ls -lah .image-garden/

          echo "Image Garden cache content:"
          ls -lah ~/snap/image-garden/common/cache/dl/

      - name: Upload logs as artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: .image-garden/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true

      - name: Save cached virtual machine images
        # Save explicitly rather than via the actions/cache post step, which
        # only fires on success: emulated runs may fail while still having
        # produced valid, reusable images. Cancelled runs are excluded, since a
        # kill mid-provision can leave a half-written overlay.
        if: ${{ (success() || failure()) && steps.restore-images.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/snap/image-garden/common/cache/dl
            .image-garden/*.qcow2
            .image-garden/*.img
            .image-garden/*.iso
            .image-garden/*.run
          key: image-garden-${{ matrix.runner.spread_test_filter }}-r${{ steps.prep.outputs.image_garden_rev }}
