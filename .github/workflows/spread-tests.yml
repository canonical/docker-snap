name: Spread Tests

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel containing the version of docker to test"
        required: true
        type: string
      spread_test_filter:
        description: "Spread test selection filter; use '...' as a wildcard"
        required: false
        type: string
        default: '...amd64'

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  spread-tests:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - label: ubuntu-latest
            spread_test_filter: ${{ inputs.spread_test_filter }}

    runs-on: ${{ matrix.runner.label }}
    # Backstop only. The spread allocate script fails fast on unreachable VMs,
    # so a healthy run finishes far sooner; this just prevents a pathological
    # hang from burning the full 6h GitHub ceiling.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prep
        id: prep
        run: |
          sudo snap install image-garden
          sudo snap install image-garden+qemu-aarch64 || true

          # We need write access to /dev/kvm for better performance.
          # Since this is an ephemeral CI/CD environment, we can grant everyone access to /dev/kvm.
          sudo chmod -v 666 /dev/kvm || true

          # Provisioned images are a function of the image-garden version, so
          # its snap revision is part of the cache key below.
          echo "image_garden_rev=$(snap list image-garden | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore cached virtual machine images
        id: restore-images
        # Pristine downloads and the provisioned overlays derived from them
        # are cached as a single entry: the overlays are qcow2 files backed by
        # the pristine images (by absolute path, with no content check), so
        # restoring them from different saves could silently corrupt guests.
        # Deliberately excludes .image-garden logs and pid files: logs are
        # uploaded as failure artifacts and must come from the current run.
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/snap/image-garden/common/cache/dl
            .image-garden/*.qcow2
            .image-garden/*.img
            .image-garden/*.iso
            .image-garden/*.run
          key: image-garden-${{ matrix.runner.spread_test_filter }}-r${{ steps.prep.outputs.image_garden_rev }}
          restore-keys: |
            image-garden-${{ matrix.runner.spread_test_filter }}-
            image-garden-dl-${{ matrix.runner.spread_test_filter }}

      - name: Run spread tests
        # Step-level timeout, deliberately below the job-level one: a step
        # timeout marks the step as failed, so the boot-log upload and cache
        # save below still run. The job-level timeout is a cancellation,
        # which would skip them all.
        timeout-minutes: 75
        run: |
          SNAP_CHANNEL="${{ inputs.snap_channel }}" image-garden.spread -v -vv "${{ matrix.runner.spread_test_filter }}"

      - name: Log image garden content
        if: ${{ failure() }}
        run: |
          echo "Image Garden directory content:"
          ls -lah .image-garden/

          echo "Image Garden cache content:"
          ls -lah ~/snap/image-garden/common/cache/dl/

      - name: Upload logs as artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: .image-garden/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true

      - name: Log cache sizes
        if: ${{ success() || failure() }}
        run: |
          du -sh ~/snap/image-garden/common/cache/dl/ || true
          du -sh .image-garden/ || true
          du -h .image-garden/*.qcow2 .image-garden/*.img .image-garden/*.iso 2>/dev/null || true

      - name: Save cached virtual machine images
        # Save explicitly rather than relying on the actions/cache post step,
        # which only fires on job success: arm64 runs have historically always
        # failed, so the cache never persisted and every run re-downloaded and
        # re-provisioned everything from scratch. Failed runs still produce
        # valid images; cancelled runs are excluded since a kill mid-provision
        # can leave a half-written overlay behind.
        if: ${{ (success() || failure()) && steps.restore-images.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/snap/image-garden/common/cache/dl
            .image-garden/*.qcow2
            .image-garden/*.img
            .image-garden/*.iso
            .image-garden/*.run
          key: image-garden-${{ matrix.runner.spread_test_filter }}-r${{ steps.prep.outputs.image_garden_rev }}
