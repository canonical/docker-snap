name: Nvidia Graphics Tests
run-name: Nvidia Graphics Tests (${{ inputs.channel || format('run {0}', inputs.run_id) }})

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id number (set this or channel)'
        required: false
        type: string
      channel:
        description: 'Snap channel to test, e.g. latest/candidate (set this or run id)'
        required: false
        type: string
      publish:
        description: 'Publish run id artifact to Store'
        default: true
        type: boolean
      fail_fast:
        description: 'Stop after first distro failure'
        default: false
        type: boolean
      arm64_queue:
        description: 'arm64 Testflinger queue (empty skips arm64)'
        required: false
        type: string

# Least-privilege: publish downloads an artifact from another run (actions: read),
# and both jobs check out this repo (contents: read).
permissions:
  contents: read
  actions: read

jobs:
    resolve:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          channel: ${{ steps.channel.outputs.channel }}
          arches: ${{ steps.matrix.outputs.arches }}
          include: ${{ steps.matrix.outputs.include }}
        steps:
            # The channel ends up unquoted in shell on the test agent, so only
            # accept well-formed run ids and <track>/<risk>/<branch> channels.
            - name: Resolve snap channel
              id: channel
              env:
                RUN_ID: ${{ inputs.run_id }}
                CHANNEL: ${{ inputs.channel }}
              run: |
                if [[ -n "$RUN_ID" && -n "$CHANNEL" ]]; then
                  echo "::error::Set either run_id or channel, not both"
                  exit 1
                elif [[ -n "$RUN_ID" ]]; then
                  if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
                    echo "::error::Invalid run_id: $RUN_ID"
                    exit 1
                  fi
                  CHANNEL="latest/edge/runid-$RUN_ID"
                elif [[ -n "$CHANNEL" ]]; then
                  if [[ ! "$CHANNEL" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*/)?(stable|candidate|beta|edge)(/[A-Za-z0-9][A-Za-z0-9._-]*)?$ ]]; then
                    echo "::error::Invalid channel: $CHANNEL"
                    exit 1
                  fi
                else
                  echo "::error::Set either run_id or channel"
                  exit 1
                fi
                echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

            # The queue name ends up in the Testflinger job yaml, so only accept
            # plain names.
            - name: Resolve test matrix
              id: matrix
              env:
                ARM64_QUEUE: ${{ inputs.arm64_queue }}
              run: |
                if [[ -n "$ARM64_QUEUE" && ! "$ARM64_QUEUE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                  echo "::error::Invalid arm64_queue: $ARM64_QUEUE"
                  exit 1
                fi
                queues='{"amd64":"docker-nvidia"}'
                if [[ -n "$ARM64_QUEUE" ]]; then
                  queues=$(jq -c --arg q "$ARM64_QUEUE" '. + {arm64: $q}' <<<"$queues")
                fi
                distros='["noble","core22-latest","core24-latest"]'
                echo "arches=$(jq -c 'keys' <<<"$queues")" >> "$GITHUB_OUTPUT"
                echo "include=$(jq -c --argjson d "$distros" \
                  '[to_entries[] as $e | $d[] | {arch: $e.key, queue: $e.value, distro: .}]' \
                  <<<"$queues")" >> "$GITHUB_OUTPUT"

    publish:
        needs: resolve
        if: ${{ inputs.run_id != '' && inputs.publish }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
          fail-fast: false
          matrix:
            arch: ${{ fromJSON(needs.resolve.outputs.arches) }}
        steps:
            # Download snap artifact from a previous smoke-test/build GitHub Workflow run
            - name: Download snap artifact
              uses: actions/download-artifact@v8
              with:
                run-id: ${{ inputs.run_id }}
                github-token: ${{ github.token }} # required for downloading from another workflow run
                name: docker_${{ inputs.run_id }}_${{ matrix.arch }}.snap
            
            # Publish snap to Store so it can be installed on the test devices.
            # Re-testing a run id uploads a snap the store already holds, which
            # it rejects on sha3 uniqueness. The first upload of that artifact
            # went to this same run id branch, so treat it as published.
            - name: Publish snap to Store
              env:
                SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
                SNAP_FILE: docker_${{ inputs.run_id }}_${{ matrix.arch }}.snap
                RELEASE: latest/edge/runid-${{ inputs.run_id }}
              run: |
                sudo snap install --classic snapcraft
                rc=0
                snapcraft upload "$SNAP_FILE" --release "$RELEASE" 2>&1 | tee upload.log || rc=$?
                if [[ $rc -ne 0 ]]; then
                  if grep -q 'Error checking upload uniqueness' upload.log; then
                    echo "::notice::$SNAP_FILE is already in the store, assuming it is on $RELEASE"
                  else
                    exit "$rc"
                  fi
                fi

    test:
        name: test (${{ matrix.arch }}, ${{ matrix.distro }})
        needs: [resolve, publish]
        # Run also when publish has been skipped (not required, or testing a channel)
        if: ${{ always() && !failure() && !cancelled() }}
        runs-on: self-hosted-linux-amd64-noble-private-endpoint-small
        # Testflinger's own global_timeout is 3600s; allow headroom for queue wait.
        timeout-minutes: 120
        strategy:
          fail-fast: ${{ inputs.fail_fast }}
          matrix:
            include: ${{ fromJSON(needs.resolve.outputs.include) }}
        env:
          TESTFLINGER_DIR: .github/workflows/testflinger
          SNAP_CHANNEL: ${{ needs.resolve.outputs.channel }}
        steps:
            - name: Event data
              run: "echo ::notice::Snap channel: $SNAP_CHANNEL"

            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create Testflinger job
              env:
                JOB_QUEUE: ${{ matrix.queue }}
                DISTRO: ${{ matrix.distro }}
              run: |

                # Prepare job
                envsubst '$JOB_QUEUE $DISTRO $SNAP_CHANNEL' \
                  < $TESTFLINGER_DIR/nvidia-job.yaml \
                  > $TESTFLINGER_DIR/nvidia-job.temp
                mv $TESTFLINGER_DIR/nvidia-job.temp $TESTFLINGER_DIR/nvidia-job.yaml

            - name: Run tests
              uses: canonical/testflinger/.github/actions/submit@545ed69f17a5e639a2299e325f5fb199ca9f98af  # submit/v1.4.8
              with:
                poll: true
                job-path: ${{ env.TESTFLINGER_DIR }}/nvidia-job.yaml
                client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
                secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
