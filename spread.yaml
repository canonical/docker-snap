project: docker
# Headroom for slow, emulated cross-architecture boots. Failures are bounded
# well below this by the per-attempt timeout and FATAL in the allocate script,
# so this only ever caps a genuinely slow (but progressing) boot.
kill-timeout: 45m
backends:
  # LXD is currently not supported as a backend, because we need to set lxc instance
  # config to make docker work in an lxc container,
  # see https://ubuntu.com/tutorials/how-to-run-docker-inside-lxd-containers#2-create-lxd-container

  #lxd:
  #  systems:
  #    - ubuntu-24.04

  garden:
    type: adhoc

    allocate: |
      # Spread automatically injects /snap/bin to PATH. When we are
      # running from the image-garden snap then SPREAD_HOST_PATH is the
      # original path before such modifications were applied. Snap
      # applications cannot normally run /snap/bin/* entry-points
      # successfully so re-set PATH to the original value, as provided by
      # snapcraft.
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi

      export QEMU_SMP_OPTION="-smp 4"
      # image-garden's default. Anything higher risks the host OOM killer:
      # spread allocates every matched system concurrently, and five emulated
      # guests at 3072 MiB plus qemu overhead exceed the 16 GiB of a standard
      # GitHub runner. The OOM killer then reaps allocate scripts or guests
      # mid-boot, which surfaces as empty "Cannot allocate" errors.
      export QEMU_MEM_OPTION="-m 2048"

      # Map spread system architecture
      SPREAD_SYSTEM=${SPREAD_SYSTEM/%amd64/x86_64}  # maps "amd64" to "x86_64"
      SPREAD_SYSTEM=${SPREAD_SYSTEM/%arm64/aarch64} # maps "arm64" to "aarch64"

      GARDEN_SYSTEM="${SPREAD_SYSTEM/-plus-/+}"

      # The qemu 'virt' machine used for aarch64 requires the EFI variable store
      # (pflash unit 1) to be exactly 64 MiB. image-garden has been observed to
      # emit a wrong-sized (or empty) vars image, which makes qemu refuse to
      # start with:
      #   cfi.pflash01 device '/machine/virt.flash1' requires 67108864 bytes,
      #   pflash1 block backend provides <N> bytes
      # Check and repair this *before* attempting to boot, not after a slow
      # failed attempt: building the vars image doesn't require booting
      # anything, so this costs seconds rather than eating into the allocate
      # watchdog below.
      EFI_VARS_SIZE=67108864 # 64 MiB
      efi_vars_img=".image-garden/${SPREAD_SYSTEM}.efi-vars.img"

      image-garden make "${GARDEN_SYSTEM}.efi-vars.img" || true
      if [ -f "$efi_vars_img" ] && [ "$(stat -c%s "$efi_vars_img")" != "$EFI_VARS_SIZE" ]; then
        echo "Repairing wrong-sized EFI vars image: $efi_vars_img"
        # qemu-img rather than truncate: binaries not shipped inside the
        # image-garden snap (truncate, timeout, ...) cannot be executed from
        # the host under confinement. qemu-img is what image-garden itself
        # uses, so it is always available. Guarded so a failed repair falls
        # through to a normal allocation failure instead of killing the
        # script under set -e.
        qemu-img resize -f raw "$efi_vars_img" "$EFI_VARS_SIZE" || true
      fi

      # Bound the attempt. A VM that never becomes reachable (for example one
      # that boots into systemd emergency mode under emulation) would otherwise
      # hang the allocation until GitHub kills the whole job at its 6h ceiling.
      # Failing fast lets the workflow's failure() steps capture the boot logs.
      # Kept comfortably under kill-timeout (45m) together with the settle
      # sleep below, so spread's own timeout never preempts our FATAL.
      allocate() {
        local allocate_pid
        local sleep_pid
        local status
        local watchdog_pid

        image-garden allocate "$GARDEN_SYSTEM" &
        allocate_pid=$!

        (
          trap 'kill "$sleep_pid" 2>/dev/null || true; exit 0' TERM

          sleep 30m &
          sleep_pid=$!
          wait "$sleep_pid"
          kill "$allocate_pid" 2>/dev/null || exit 0

          sleep 30s &
          sleep_pid=$!
          wait "$sleep_pid"
          kill -KILL "$allocate_pid" 2>/dev/null || true
        ) &
        watchdog_pid=$!

        if wait "$allocate_pid"; then
          status=0
        else
          status=$?
        fi

        kill "$watchdog_pid" 2>/dev/null || true
        wait "$watchdog_pid" 2>/dev/null || true
        return "$status"
      }

      if ! OUT="$(allocate)" || [ -z "$OUT" ]; then
        # FATAL (not ERROR) so spread does not retry into the 6h ceiling.
        FATAL "image-garden could not allocate $SPREAD_SYSTEM"
      fi

      HOST_ARCH="${ARCH:-$(uname -m)}"
      SYSTEM_ARCH="${SPREAD_SYSTEM##*.}"
      if [ "$HOST_ARCH" != "$SYSTEM_ARCH" ] || [ ! -e /dev/kvm ]; then
        # Spread's ssh-ready timeout is a fixed 5 minutes, which emulated or
        # non-KVM boots can overrun. This used to be a flat "sleep 5m", but
        # image-garden tends to hand out the address only once sshd is already
        # answering, making most of that sleep pure waste. Poll for an ssh
        # banner instead and hand over as soon as the daemon responds, keeping
        # the old 5 minutes as the upper bound. Uses bash /dev/tcp and the
        # read builtin rather than external tools (the timeout binary, for
        # one, is denied by confinement in the image-garden snap environment).
        ssh_host="${OUT%:*}"
        ssh_port="${OUT##*:}"
        ssh_banner_ready() {
          (
            exec 3<>"/dev/tcp/${ssh_host}/${ssh_port}" || exit 1
            banner=""
            IFS= read -r -t 10 -n 4 banner <&3 || true
            [ "$banner" = "SSH-" ]
          ) 2>/dev/null
        }
        # Cap of 120 x 5s = 10 minutes. Falling through with sshd still down
        # is worse than waiting: spread only grants one minute of connection
        # attempts after ADDRESS, then discards the whole system (observed
        # with ubuntu-cloud-26.04 booting alongside four other guests).
        # Budget-wise this still fits: one 30m30s allocate attempt plus 10m
        # of polling stays under the 45m kill-timeout.
        attempts=0
        while [ "$attempts" -lt 120 ]; do
          if ssh_banner_ready; then
            echo "ssh is answering on $OUT"
            break
          fi
          attempts=$((attempts + 1))
          sleep 5
        done
      fi

      ADDRESS "$OUT"
    discard: |
      # Spread automatically injects /snap/bin to PATH. When we are
      # running from the image-garden snap then SPREAD_HOST_PATH is the
      # original path before such modifications were applied. Snap
      # applications cannot normally run /snap/bin/* entry-points
      # successfully so re-set PATH to the original value, as provided by
      # snapcraft.
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi

      image-garden discard "$SPREAD_SYSTEM_ADDRESS"
    systems:
      # Want to add more systems? Look here for a list of available systems: https://gitlab.com/zygoon/image-garden/-/tree/main/data
      # or look here for an exhaustive example: https://gitlab.com/zygoon/image-garden/-/blob/main/spread-demo/spread.yaml
      # Note: ubuntu core images are prepared via this script: https://gitlab.com/zygoon/image-garden/-/blob/main/mk/050-ubuntu-core.mk
      - ubuntu-core-22.amd64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_AMD64)
      - ubuntu-core-22.arm64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_ARM64)
      - ubuntu-cloud-22.04.amd64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_AMD64)
      - ubuntu-cloud-22.04.arm64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_ARM64)

      - ubuntu-core-24.amd64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_AMD64)
      - ubuntu-core-24.arm64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_ARM64)
      - ubuntu-cloud-24.04.amd64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_AMD64)
      - ubuntu-cloud-24.04.arm64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_ARM64)
      - ubuntu-cloud-24.04.riscv64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_RISCV64)

      - ubuntu-cloud-26.04.amd64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_AMD64)
      - ubuntu-cloud-26.04.arm64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_ARM64)
      - ubuntu-cloud-26.04.riscv64:
          username: ubuntu
          password: ubuntu
          environment:
            SNAP_FILE: $(HOST:echo $SNAP_FILE_RISCV64)

path: /tmp/docker
exclude:
  - .git
  - "*.qcow2"
  - "*.iso"
  - "*.img"
  - "*.log"
  - "*.run"
  - "*.pid"
  - ".image-garden/*"

suites:
  spread/main/:
    summary: Full-system tests for the docker snap

environment:
  SCRIPTS_PATH: $SPREAD_PATH/spread/scripts
  SNAP_CHANNEL: $(HOST:echo $SNAP_CHANNEL) # The Snap Store channel containing the version of docker to test

prepare: |
  # Invoked in each system before running any test
  # Learn more about preparing and restoring: https://github.com/canonical/spread?tab=readme-ov-file#preparing

  . "$SCRIPTS_PATH/prepare.sh"
